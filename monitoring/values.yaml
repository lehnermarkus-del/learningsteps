prometheus:
  prometheusSpec:
    retention: 2h
    resources:
      requests: {cpu: 50m, memory: 128Mi}
    additionalScrapeConfigs:
      - job_name: learningsteps
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [learningsteps]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: learningsteps
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
grafana:
  service:
    type: ClusterIP
  defaultDashboardsEnabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
alertmanager:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
