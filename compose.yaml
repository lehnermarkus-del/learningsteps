services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learningsteps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
      POSTGRES_DB: learningsteps
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U learningsteps"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database_setup.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://learningsteps:${POSTGRES_PASSWORD}@db:5432/learningsteps
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  pgdata:
